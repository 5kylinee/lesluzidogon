<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INF03 - Galeria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style3.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">
            <img src="blackbullblue.png" alt="Logo">
        </div>
        <ul class="nav-links">
            <li><a href="index.html">Strona główna</a></li>
            <li><a href="about.html">O nas</a></li>
            <li><a href="gallery.html">Galeria</a></li>
            <li><a href="https://forum-lesluzidogon.pages.dev/">Forum</a></li>
        </ul>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h1>Leśluzidogon<br><span>Racing</span></h1>
        </div>
        <div class="hero-image">
            <img src="car1.png" alt="Racing Car">
        </div>
        <div class="bottom-logo">
            <img src="blacklr.png" alt="Leśluzidogon Text Logo">
        </div>
    </section>

    <section id="about" class="about">
        <div class="about-image">
            <img src="car2.png" alt="Racing Car 2">
        </div>
        <div class="about-content">
            <p class="quote-text">
                <span class="highlight">Samochody</span>
            </p>

            <!-- Galeria -->
            <div class="gallery" id="gallery">
                <div class="g-stage">
                    <button class="g-arrow g-prev" id="g-prev" aria-label="Poprzednie zdjęcie">&#10094;</button>
                    <div class="g-viewport" id="g-viewport">
                        <img src="car6.png" alt="Zdjęcie 1">
                    </div>
                    <button class="g-arrow g-next" id="g-next" aria-label="Następne zdjęcie">&#10095;</button>
                </div>
                <div class="g-counter" id="g-counter">1 / 6</div>
                <div class="g-thumbs" id="g-thumbs"></div>
            </div>
        </div>
    </section>

    <section id="contact" class="contact">
        <h2>INF 03</h2>
        <p>Zadanie domowe Konrad M.</p>
    </section>

    <section class="social">
        <h2>Zaobserwuj nas!</h2>
        <a href="https://www.youtube.com/channel/UCXXXXXX" target="_blank">YouTube</a>
    </section>

    <script src="script3.js"></script>
</body>
</html>
